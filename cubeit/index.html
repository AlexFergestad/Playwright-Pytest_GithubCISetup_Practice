<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube a Number</title>
</head>
<body>

    <h2>Cube a Number</h2>
    
    <label for="numberInput">Enter a number: </label>
    <input type="number" id="numberInput" placeholder="Type a number">
    
    <button onclick="cubeNumber()">Cube</button>
    
    <p>Result: <span id="result">--</span></p>

    <script>
        function cubeNumber() {
            const num = parseFloat(document.getElementById('numberInput').value);
            if (!isNaN(num)) {
                const cubed = Math.pow(num, 3); // or num * num * num
                document.getElementById('result').textContent = cubed;
            } else {
                document.getElementById('result').textContent = 'Please enter a valid number';
            }
        }
    </script>

</body>
</html>
